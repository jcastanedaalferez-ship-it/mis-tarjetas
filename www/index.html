<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff4a1c">
<title>Mis Tarjetas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Sofia+Sans+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: herramienta de dinero, clara y directa, pensada para el celular
   IDEA: la cartera — cada tarjeta se ve como una tarjeta física con su próximo pago
   PICTURE: total por pagar enorme sobre bloque bermellón + tarjetas de color
   COLOUR and TYPE: blanco, negro, bermellón #ff4a1c; Sofia Sans Condensed 800 + Instrument Sans
   LAYOUT: una columna móvil, pestañas abajo, botón + flotante, hojas deslizables */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#120d0b);--ink:light-dark(#141110,#f4eeea);--mut:light-dark(#6b625d,#a89c95);--line:light-dark(#e9e2dd,#2e2421);--soft:light-dark(#f5f1ee,#1e1714);--acc:#ff4a1c;--bad:light-dark(#c0261a,#ff7b6b);--ok:light-dark(#1f7a4d,#5cc98f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Instrument Sans',system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{max-width:760px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 4px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font:800 26px/1 'Sofia Sans Condensed',sans-serif}.brand b{color:var(--acc)}
.st{font-size:13px;color:var(--mut);text-align:right}
main{max-width:760px;margin:0 auto;padding:0 16px}
h2{font:800 28px/1.05 'Sofia Sans Condensed',sans-serif;margin:28px 0 10px;text-wrap:balance}
.sub{color:var(--mut);font-size:14px;margin:-4px 0 10px}
.hero{background:var(--acc);color:#fff;border-radius:22px;padding:20px;margin-top:10px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero small{font-size:14px;font-weight:600;opacity:.92}
.big{font:800 clamp(44px,14vw,66px)/1 'Sofia Sans Condensed',sans-serif;margin:6px 0 8px;white-space:nowrap}
.hstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;font-size:14px;position:relative}
.hstats b{display:block;font:800 22px/1.1 'Sofia Sans Condensed',sans-serif}
.alert{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--acc);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:15px}
.alert.bad{border-color:var(--bad);color:var(--bad)}
.alert svg{flex:none;margin-top:2px}
.sample{background:var(--soft);border-radius:14px;padding:10px 14px;margin-top:10px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.wallet{display:grid;gap:12px}
@media(min-width:640px){.wallet{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cc{border-radius:18px;padding:16px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));box-shadow:0 10px 22px -14px var(--c),inset 0 1px 0 rgba(255,255,255,.25);position:relative;overflow:hidden}
.cc:before{content:"";position:absolute;right:16px;top:16px;width:34px;height:26px;border-radius:6px;background:linear-gradient(135deg,#f3d58a,#b8913d);opacity:.9}
.cc h3{margin:0 0 10px;font:800 22px/1.1 'Sofia Sans Condensed',sans-serif;padding-right:46px}
.cc .amt{font:800 34px/1 'Sofia Sans Condensed',sans-serif;white-space:nowrap}
.cc .when{font-size:14px;opacity:.95;margin-top:4px}
.cc .tag{display:inline-block;background:rgba(0,0,0,.28);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600;margin-top:8px}
.cc .tag.bad{background:#fff;color:#b3160b}
.cc .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;font-size:13px;opacity:.95;flex-wrap:wrap}
.cc .use{height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:10px;overflow:hidden}.cc .use span{display:block;height:100%;background:#fff}
.cc button{background:rgba(255,255,255,.95);color:#141110;border:0;border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px;min-height:40px}
.cc button.ghost{background:transparent;color:#fff;text-decoration:underline;padding:8px 4px}
.list{border-top:1px solid var(--line)}
.it{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:inherit}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.it .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .m{font-size:13px;color:var(--mut)}
.it .r{text-align:right;white-space:nowrap;font-weight:700}
.it .r small{display:block;font-weight:500;color:var(--mut);font-size:13px}
.prog{height:6px;border-radius:3px;background:var(--soft);margin-top:6px;overflow:hidden}.prog span{display:block;height:100%;background:var(--c)}
.pj{display:grid;grid-template-columns:42px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:14px;margin:7px 0}
.pj .v{text-align:right;font-weight:700;white-space:nowrap}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--soft)}.bar span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut);margin:4px 0 6px}.legend span{display:inline-flex;align-items:center;gap:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;font:16px 'Instrument Sans';padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);margin-bottom:10px;min-height:48px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 10px}
.calhead h2{margin:0;text-transform:capitalize}
.icon{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);display:grid;place-items:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:12px;color:var(--mut);text-align:center;font-weight:600}
.cal button{min-height:52px;border:0;border-radius:12px;background:var(--soft);color:var(--ink);font-weight:600;font-size:15px;display:flex;flex-direction:column;align-items:center;padding:6px 2px 4px;gap:4px}
.cal button.today{box-shadow:inset 0 0 0 2px var(--acc)}
.cal button.sel{background:var(--ink);color:var(--bg)}
.mk{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.mk i{width:9px;height:9px;border-radius:50%;display:block}
.mk i.pay{background:var(--c)}.mk i.cut{border:2px solid var(--c)}.mk i.buy{width:5px;height:5px;background:var(--mut)}
.key{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:10px 0}.key span{display:inline-flex;gap:6px;align-items:center}
.box{background:var(--soft);border-radius:16px;padding:6px 14px;margin-top:12px}
.box .it{border-color:var(--line)}.box .it:last-child{border-bottom:0}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:16px;min-height:48px;background:var(--ink);color:var(--bg)}
.btn.acc{background:var(--acc);color:#fff}.btn.out{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.bad{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{background:none;border:0;color:var(--mut);font-weight:600;font-size:12px;padding:8px 0 10px;display:grid;justify-items:center;gap:3px;min-height:58px}
.tabs button[aria-current=true]{color:var(--acc)}
.fab{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--acc);color:#fff;border:0;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(255,74,28,.8);z-index:6}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{font:800 26px/1.05 'Sofia Sans Condensed',sans-serif;margin:0;flex:1}
.shead{display:flex;align-items:center;gap:10px}
.f{display:block;margin:14px 0 0;font-weight:600;font-size:14px}
.f input,.f select{display:block;width:100%;margin-top:6px;font:16px 'Instrument Sans',sans-serif;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);min-height:48px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
.prev{background:var(--soft);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:14px}
.prev b{font-size:16px}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.sw label{width:40px;height:40px;border-radius:50%;background:var(--c);display:grid;place-items:center;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw input:checked+span{width:16px;height:16px;border-radius:50%;background:#fff}
.sw input:focus-visible+span{outline:3px solid var(--ink)}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
textarea{width:100%;min-height:110px;font:13px/1.4 monospace;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink)}
.set p{margin:6px 0;font-size:15px}
</style>
</head>
<body>
<header class="top"><div class="brand">Mis <b>Tarjetas</b></div></header>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Agregar gasto"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabs" id="tabs">
<button data-t="inicio"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
<button data-t="gastos"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Gastos</button>
<button data-t="calendario"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario</button>
<button data-t="tarjetas"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>Tarjetas</button>
</nav>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MXN=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'});
const money=n=>MXN.format(Math.round((n||0)*100)/100);
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const CATS=['Súper','Comida','Gasolina','Servicios','Salud','Ropa','Hogar','Electrónica','Entretenimiento','Viajes','Educación','Otros'];
const COLORS=['#2457d6','#c99a2e','#e0442b','#1f7a4d','#7b3fd1','#2b2523','#0d7680','#d6246e'];
const MSI=[1,3,6,9,10,12,13,15,18,24,36,48];
const ICON_BELL='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg>';
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const T0=new Date();T0.setHours(0,0,0,0);
const kT=T0.getFullYear()*12+T0.getMonth();
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const kDate=(k,day)=>{const y=Math.floor(k/12),m=k-y*12;return new Date(y,m,Math.min(day,dim(y,m)))};
const cutD=(c,k)=>kDate(k,c.cut);
const dueK=(c,k)=>c.pay>c.cut?k:k+1;
const dueD=(c,k)=>kDate(dueK(c,k),c.pay);
const stmtOf=(c,d)=>{let k=d.getFullYear()*12+d.getMonth();if(d.getDate()>cutD(c,k).getDate())k++;return k};
const days=(a,b)=>Math.round((b-a)/864e5);
const fd=d=>d.getDate()+' '+MES[d.getMonth()];
const uid=()=>Math.random().toString(36).slice(2,10);

let S;
try{S=JSON.parse(localStorage.getItem('mt-state')||'{}')||{}}catch(e){S={}}
S.cards=S.cards||[];S.exp=S.exp||[];S.paid=S.paid||{};
const card=id=>S.cards.find(c=>c.id===id);

function inst(){
  const out=[];
  for(const e of S.exp){const c=card(e.card);if(!c)continue;
    const n=Math.max(1,e.months|0),k0=stmtOf(c,parse(e.date)),base=Math.round(e.amount/n*100)/100;
    for(let i=0;i<n;i++)out.push({e,c,i,n,k:k0+i,amt:i===n-1?Math.round((e.amount-base*(n-1))*100)/100:base});
  }return out}
function stmts(I){const m={};for(const x of I){const key=x.c.id+'|'+x.k;if(!m[key])m[key]={c:x.c,k:x.k,total:0,items:[]};m[key].total+=x.amt;m[key].items.push(x)}return m}
const isPaid=(c,k)=>!!S.paid[c.id+'|'+k];
function markPastPaid(filter){const M=stmts(inst());for(const s of Object.values(M))if(dueD(s.c,s.k)<T0&&(!filter||filter(s)))S.paid[s.c.id+'|'+s.k]=true}

if(!S.cards.length&&!S.started){
  const a={id:uid(),name:'Tarjeta Azul',color:'#2457d6',cut:3,pay:23,limit:45000,remind:3},
  b={id:uid(),name:'Tarjeta Oro',color:'#c99a2e',cut:15,pay:5,limit:30000,remind:3},
  r={id:uid(),name:'Tarjeta Roja',color:'#e0442b',cut:28,pay:18,limit:20000,remind:2};
  const ago=n=>iso(new Date(T0.getFullYear(),T0.getMonth(),T0.getDate()-n));
  S={sample:true,t:1,cards:[a,b,r],paid:{},exp:[
    {id:uid(),card:a.id,desc:'Pantalla 55 pulgadas',amount:9600,months:12,date:ago(75),cat:'Electrónica'},
    {id:uid(),card:b.id,desc:'Laptop',amount:14400,months:6,date:ago(48),cat:'Electrónica'},
    {id:uid(),card:r.id,desc:'Refrigerador',amount:8970,months:9,date:ago(20),cat:'Hogar'},
    {id:uid(),card:a.id,desc:'Supermercado',amount:1854.5,months:1,date:ago(6),cat:'Súper'},
    {id:uid(),card:a.id,desc:'Gasolina',amount:900,months:1,date:ago(3),cat:'Gasolina'},
    {id:uid(),card:b.id,desc:'Cena de cumpleaños',amount:1320,months:1,date:ago(9),cat:'Comida'},
    {id:uid(),card:b.id,desc:'Tenis',amount:2399,months:3,date:ago(2),cat:'Ropa'},
    {id:uid(),card:r.id,desc:'Internet y celular',amount:749,months:1,date:ago(12),cat:'Servicios'},
    {id:uid(),card:r.id,desc:'Farmacia',amount:386,months:1,date:ago(1),cat:'Salud'}]};
  markPastPaid();
}

let tab='inicio',fcard='all',q='',cal=kT,sel=iso(T0),sheetOpen=false;
try{tab=sessionStorage.getItem('mt-tab')||'inicio';const st=JSON.parse(sessionStorage.getItem('mt-ui')||'{}');if(st.cal)cal=st.cal;if(st.sel)sel=st.sel;if(st.fcard)fcard=st.fcard}catch(e){}

/* ---------- guardado y avisos nativos ---------- */
const Cap=window.Capacitor,native=!!(Cap&&Cap.isNativePlatform&&Cap.isNativePlatform());
const LN=native?Cap.registerPlugin('LocalNotifications'):null,APP=native?Cap.registerPlugin('App'):null;
let nperm='prompt';
function save(){S.t=Date.now();try{localStorage.setItem('mt-state',JSON.stringify(S))}catch(e){}clearTimeout(save.t);save.t=setTimeout(schedule,800)}
function plan(){
  const M=stmts(inst()),out=[];
  for(const c of S.cards){const k1=stmtOf(c,T0);for(let k=k1-1;k<k1+12;k++){const d=dueD(c,k);if(d<T0||isPaid(c,k))continue;const s=M[c.id+'|'+k],amt=s?s.total:0;
    const pre=new Date(d.getFullYear(),d.getMonth(),d.getDate()-c.remind,9,0),day=new Date(d.getFullYear(),d.getMonth(),d.getDate(),9,0);
    const txt=amt>0?money(amt):'revisa tu estado de cuenta';
    if(c.remind>0)out.push({at:pre,title:'Pago de '+c.name+' en '+c.remind+(c.remind>1?' días':' día'),body:'Fecha límite: '+fd(d)+' · '+txt});
    out.push({at:day,title:'Hoy vence '+c.name,body:'Paga antes de que termine el día · '+txt});}}
  return out.filter(n=>n.at>new Date()).sort((a,b)=>a.at-b.at).slice(0,60);
}
async function schedule(){
  if(!LN||S.sample)return;
  try{const p=await LN.checkPermissions();nperm=p.display;if(nperm!=='granted')return;
    const pend=await LN.getPending();if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const list=plan().map((n,i)=>({id:1000+i,title:n.title,body:n.body,schedule:{at:n.at,allowWhileIdle:true},smallIcon:'ic_stat_card',iconColor:'#ff4a1c'}));
    if(list.length)await LN.schedule({notifications:list});
  }catch(e){console.log('avisos',e)}
}
async function askPerm(){
  if(!LN){toast('Los avisos funcionan en la app instalada');return}
  try{const p=await LN.requestPermissions();nperm=p.display;if(nperm==='granted'){await schedule();toast('Avisos activados')}else toast('Activa las notificaciones en Ajustes del teléfono')}catch(e){toast('No se pudieron activar los avisos')}
  if(tab==='tarjetas')render();
}
async function testNotif(){
  if(!LN||nperm!=='granted'){askPerm();return}
  try{await LN.schedule({notifications:[{id:999,title:'Mis Tarjetas',body:'Así te llegarán los recordatorios de pago.',schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true},smallIcon:'ic_stat_card',iconColor:'#ff4a1c'}]});toast('Llegará en 5 segundos')}catch(e){toast('No se pudo enviar la prueba')}
}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200)}

/* ---------- vistas ---------- */
function nextFor(c,M){
  const kOpen=stmtOf(c,T0);
  const owed=Object.values(M).filter(s=>s.c===c&&s.k<kOpen&&s.total>0.004&&!isPaid(c,s.k)).sort((a,b)=>a.k-b.k);
  return {owed,kOpen,open:M[c.id+'|'+kOpen]};
}
function whenTxt(d){const n=days(T0,d);return n<0?'vencido hace '+(-n)+(n===-1?' día':' días'):n===0?'vence hoy':n===1?'vence mañana':'faltan '+n+' días'}
function home(I,M){

    const done=x.n-left.length;msiRows.push(`<button class="it" data-a="exp-edit" data-id="${x.e.id}" style="--c:${esc(x.c.color)}"><i class="dot"></i><div><div class="t">${esc(x.e.desc)}</div><div class="m">${esc(x.c.name)} · ${done} de ${x.n} pagados · ${money(mine[0].amt)}/mes</div><div class="prog"><span style="width:${(done/x.n*100).toFixed(0)}%"></span></div></div><div class="r">${money(rem)}<small>restan ${left.length}</small></div></button>`)}

  const mx=Math.max(1,...months.map(m=>m.sum));

function dayEvents(D,M){
  const y=D.getFullYear(),m=D.getMonth(),n=dim(y,m),mk=y*12+m,d=D.getDate(),ev=[];
  for(const c of S.cards){
    if(Math.min(c.pay,n)===d){const k=c.pay>c.cut?mk:mk-1,s=M[c.id+'|'+k];ev.push({c,type:'pay',k,amt:s?s.total:0})}
    if(Math.min(c.cut,n)===d){const s=M[c.id+'|'+mk];ev.push({c,type:'cut',k:mk,amt:s?s.total:0})}
  }return ev}

  const up=[];for(let i=0;i<=45;i++){const D=new Date(T0.getFullYear(),T0.getMonth(),T0.getDate()+i);for(const e of dayEvents(D,M))up.push({D,...e})}

  else if(a==='cal'){cal+=+b.dataset.v;render()}
  else if(a==='day'){sel=b.dataset.d;render()}
  else if(a==='fresh'||a==='wipe'){if(a==='wipe'&&!b.dataset.sure){b.dataset.sure=1;b.textContent='Toca otra vez para borrar todo';return}S={cards:[],exp:[],paid:{},started:true};fcard='all';save();tab=a==='fresh'?'tarjetas':'inicio';render();if(a==='fresh')cardSheet()}
  else if(a==='copy'){const t=JSON.stringify(S);navigator.clipboard.writeText(t).then(()=>toast('Respaldo copiado')).catch(()=>openSheet(head('Copia tu respaldo')+'<p class="sub">Mantén presionado el texto y cópialo.</p><textarea readonly>'+esc(t)+'</textarea>'))}
  else if(a==='notif')askPerm();
  else if(a==='test')testNotif();
  else if(a==='paste')openSheet(head('Pegar respaldo')+'<p class="sub">Pega aquí el texto de tu respaldo.</p><textarea id="pt"></textarea><div class="err" id="er"></div><div class="btns"><button class="btn acc" data-a="restore">Restaurar</button></div>');
  else if(a==='restore'){try{restore($('#pt').value)}catch(e){$('#er').textContent='Ese texto no es un respaldo válido.'}}
});
$('#fab').onclick=()=>expSheet();
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetOpen)closeSheet()});
if(APP)APP.addListener('backButton',()=>{if(sheetOpen)closeSheet();else if(tab!=='inicio'){tab='inicio';render()}else APP.exitApp()});
if(APP)APP.addListener('resume',()=>{if(iso(new Date())!==iso(T0)&&!sheetOpen)location.reload()});
render();
if(LN)LN.checkPermissions().then(p=>{nperm=p.display;if(nperm==='prompt'||nperm==='prompt-with-rationale')return askPerm();return schedule()}).then(()=>{if(tab==='tarjetas')render()}).catch(()=>{});
}
</script>
</body>
